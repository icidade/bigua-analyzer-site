<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src data: https://github.com https://githubusercontent.com https://*.githubusercontent.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" />

<body>

      <a class="brand" href="/" aria-label="Biguá Analyzer home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Biguá Analyzer</span>

        <a class="nav-link" href="/research/materials/">Materials</a>
      </nav>
    </div>

  <main>
    <section class="section site-shell page-hero not-found">
      <div class="page-hero-inner">
        <p class="not-found-code" aria-hidden="true">404</p>
        <h1 class="page-title">Page not found</h1>
        <p class="page-lead">The page you are looking for does not exist or has moved.</p>
        <div class="hero-actions compact-actions">
          <a class="btn btn-primary" href="/">Go back home</a>
          <a class="btn btn-outline" href="/research/">Open research</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 Biguá Analyzer. Independent research initiative.</span>
      <span><a href="https://github.com/icidade/bigua-analyzer" target="_blank" rel="noreferrer noopener">GitHub</a></span>
      <span><a href="mailto:contact@bigua-analyzer.io">contact@bigua-analyzer.io</a></span>
